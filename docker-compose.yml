# Локальний запуск усього стеку: docker compose up --build
# Секрети беруться з файлу .env поруч (див. README)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/tracker?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env}
      FRONTEND_URL: http://localhost:8080
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      HENRIKDEV_API_KEY: ${HENRIKDEV_API_KEY:-}
      TRUST_PROXY_HOPS: 0
    ports:
      - "5001:5001"

  web:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5001/api
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db-data:
